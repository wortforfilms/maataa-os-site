name: uptime

on:
  schedule:
    - cron: "41 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Pages answer 200 and carry security headers
        run: |
          set -e
          base=https://maataa-os.allb.xyz
          for p in / /updates /roadmap /vision /faq /feed.xml /.well-known/security.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base$p")
            echo "$p $code"
            test "$code" = 200
          done
          curl -sSI "$base/" | grep -qi '^strict-transport-security:'
          curl -sSI "$base/" | grep -qi '^content-security-policy:'
          echo "all good"
